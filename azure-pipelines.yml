trigger:
- master    # change to main if your branch is 'main'

pool:
  vmImage: 'windows-latest'

steps:
# Restore NuGet packages for the project
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'PageObjectModelCsharp.csproj'

# Build the project
- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'PageObjectModelCsharp.csproj'
    arguments: '--configuration Release'

# Run tests, create TRX + coverage, BUT do not fail pipeline if tests fail
- task: DotNetCoreCLI@2
  displayName: 'Test'
  continueOnError: true          # <-- important: pipeline continues even if tests fail
  inputs:
    command: 'test'
    projects: 'PageObjectModelCsharp.csproj'
    arguments: >
      --configuration Release
      --logger "trx;LogFileName=TestResults.trx"
      --collect "XPlat Code Coverage"
    publishTestResults: false

# Publish TRX results so they show in Tests tab
- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/TestResults.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: false   # don't fail this step if tests failed
    testRunTitle: 'UI Automation - $(Build.BuildNumber)'

# Publish code coverage to Code Coverage tab
- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml'
    reportDirectory: '$(System.DefaultWorkingDirectory)/**/TestResults'
    failIfCoverageEmpty: false