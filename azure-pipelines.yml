trigger:
- master    # change to main if your default branch is 'main'

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  project: 'PageObjectModelCsharp.csproj'

steps:
# Restore NuGet packages for the project
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '$(project)'

# Build the project
- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '$(project)'
    arguments: '--configuration $(buildConfiguration)'

# Run tests, create TRX + coverage
# continueOnError so pipeline continues even if some tests fail
- task: DotNetCoreCLI@2
  displayName: 'Test'
  continueOnError: true
  inputs:
    command: 'test'
    projects: '$(project)'
    arguments: >
      --configuration $(buildConfiguration)
      --logger "trx;LogFileName=TestResults.trx"
      --collect "XPlat Code Coverage"
    publishTestResults: false

# Publish TRX results so they show in Tests tab
- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/TestResults.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: false
    testRunTitle: 'UI Automation - $(Build.BuildNumber)'

# Install ReportGenerator global tool
- task: PowerShell@2
  displayName: 'Install ReportGenerator tool'
  condition: succeededOrFailed()
  inputs:
    targetType: 'inline'
    script: |
      dotnet tool install -g dotnet-reportgenerator-globaltool

# Generate HTML + Cobertura coverage report (rich view)
- task: PowerShell@2
  displayName: 'Generate code coverage report'
  condition: succeededOrFailed()
  inputs:
    targetType: 'inline'
    script: |
      $env:Path += ";$env:USERPROFILE\.dotnet\tools"
      reportgenerator `
        -reports:"$(System.DefaultWorkingDirectory)\**\coverage.cobertura.xml" `
        -targetdir:"$(System.DefaultWorkingDirectory)\CodeCoverage" `
        -reporttypes:"HtmlInline_AzurePipelines;Cobertura"

# Publish code coverage so it shows under Code Coverage tab
- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  condition: succeededOrFailed()
  inputs:
    codeCoverageTool: 'Cobertura'
    summaryFileLocation: '$(System.DefaultWorkingDirectory)/CodeCoverage/Cobertura.xml'
    reportDirectory: '$(System.DefaultWorkingDirectory)/CodeCoverage'
    failIfCoverageEmpty: false

# Publish the HTML coverage report as a build artifact
- task: PublishBuildArtifacts@1
  displayName: 'Publish HTML coverage report'
  condition: succeededOrFailed()
  inputs:
    PathtoPublish: '$(System.DefaultWorkingDirectory)/CodeCoverage'
    ArtifactName: 'CodeCoverageReport'
    publishLocation: 'Container'