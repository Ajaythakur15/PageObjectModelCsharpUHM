trigger:
- master   # if your default branch is main, change to main

pool:
  vmImage: 'windows-latest'

steps:
# Install NuGet CLI (recommended)
- task: NuGetToolInstaller@1
  displayName: 'Install NuGet'

# Restore all NuGet packages for the solution
- task: NuGetCommand@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    restoreSolution: '**/*.sln'
    feedsToUse: 'select'
    vstsFeed: ''

# Build the solution using Visual Studio build
- task: VSBuild@1
  displayName: 'Build solution'
  inputs:
    solution: '**/*.sln'
    platform: 'Any CPU'
    configuration: 'Release'

# Run tests (NUnit/MSTest in PageObjectModelCsharp.dll)
- task: VSTest@2
  displayName: 'Run tests'
  inputs:
    testSelector: 'testAssemblies'
    testAssemblyVer2: |
      **\PageObjectModelCsharp.dll
    searchFolder: '$(System.DefaultWorkingDirectory)'
    diagnosticsEnabled: false
    testRunTitle: 'UI Automation - $(Build.BuildNumber)'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration Release'

- task: DotNetCoreCLI@2
  displayName: 'Run tests'
  inputs:
    command: 'test'
    projects: '**/*.csproj'
    arguments: '--configuration Release --logger "trx;LogFileName=TestResults.trx"'
    publishTestResults: false

- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/TestResults.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    failTaskOnFailedTests: true
    testRunTitle: 'UI Automation - $(Build.BuildNumber)'
