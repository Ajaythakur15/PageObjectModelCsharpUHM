name: .NET CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    # Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Cache NuGet packages (faster builds)
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Build solution
    - name: Build solution
      run: dotnet build --no-restore --configuration ${{ matrix.configuration }}

    # Run tests
    - name: Run tests
      run: dotnet test --no-build --configuration ${{ matrix.configuration }} --verbosity normal

    # Run tests with coverage (optional but recommended)
    - name: Collect code coverage
      run: dotnet test --collect:"XPlat Code Coverage"

    # Upload test results / coverage
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TestResults-${{ matrix.configuration }}
        path: |
          **/TestResults/**
          **/coverage.cobertura.xml
